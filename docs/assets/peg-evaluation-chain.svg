-family="Lato, Noto Sans, sans-serif" font-size="29" font-weight="400">R0 RankIC</text><text x="1510" y="1025" text-anchor="middle" fill="#0B6E69" font-family="Lato, Noto Sans, sans-serif" font-size="29" font-weight="400">clean-active at 3 bps</text><line x1="680" y1="1060" x2="680" y2="2738" stroke="#5E6B76" stroke-width="4"/><line x1="1510" y1="1060" x2="1510" y2="2738" stroke="#0B6E69" stroke-width="4"/><line x1="0" y1="1346" x2="2400" y2="1346" stroke="#CDD9DF" stroke-width="2"/><text x="0" y="1232" text-anchor="start" fill="#152536" font-family="Lato, Noto Sans, sans-serif" font-size="38" font-weight="700">Time h5</text><path d="M 680 1220 C 1070 1220, 1480 1220, 1510 1220" fill="none" stroke="#5E6B76" stroke-width="16" stroke-linecap="round"/><circle cx="680" cy="1220" r="28" fill="#5E6B76"/><circle cx="1510" cy="1220" r="28" fill="#5E6B76"/><text x="632" y="1232" text-anchor="end" fill="#152536" font-family="Lato, Noto Sans, sans-serif" font-size="36" font-weight="600">LightGBM</text><text x="1564" y="1232" text-anchor="start" fill="#152536" font-family="Lato, Noto Sans, sans-serif" font-size="36" font-weight="700">LightGBM</text><text x="1564" y="1269" text-anchor="start" fill="#5E6B76" font-family="Lato, Noto Sans, sans-serif" font-size="29" font-weight="600">same leader</text><text x="1564" y="1304" text-anchor="start" fill="#5E6B76" font-family="Lato, Noto Sans, sans-serif" font-size="29" font-weight="600">Sharpe -0.432</text><line x1="0" y1="1626" x2="2400" y2="1626" stroke="#CDD9DF" stroke-width="2"/><text x="0" y="1512" text-anchor="start" fill="#152536" font-family="Lato, Noto Sans, sans-serif" font-size="38" font-weight="700">Time h20</text><path d="M 680 1500 C 1070 1500, 1480 1500, 1510 1500" fill="none" stroke="#B8493C" stroke-width="16" stroke-linecap="round"/><circle cx="680" cy="1500" r="28" fill="#5E6B76"/><circle cx="1510" cy="1500" r="28" fill="#0B6E69"/><text x="632" y="1512" text-anchor="end" fill="#152536" font-family="Lato, Noto Sans, sans-serif" font-size="36" font-weight="600">LightGBM</text><text x="1564" y="1512" text-anchor="start" fill="#152536" font-family="Lato, Noto Sans, sans-serif" font-size="36" font-weight="700">Kairos-64</text><text x="1564" y="1549" text-anchor="start" fill="#B8493C" font-family="Lato, Noto Sans, sans-serif" font-size="29" font-weight="600">identity changes</text><text x="1564" y="1584" text-anchor="start" fill="#B8493C" font-family="Lato, Noto Sans, sans-serif" font-size="29" font-weight="600">Sharpe 0.205</text><line x1="0" y1="1906" x2="2400" y2="1906" stroke="#CDD9DF" stroke-width="2"/><text x="0" y="1792" text-anchor="start" fill="#152536" font-family="Lato, Noto Sans, sans-serif" font-size="38" font-weight="700">Time h50</text><path d="M 680 1780 C 1070 1780, 1480 1780, 1510 1780" fill="none" stroke="#B8493C" stroke-width="16" stroke-linecap="round"/><circle cx="680" cy="1780" r="28" fill="#5E6B76"/><circle cx="1510" cy="1780" r="28" fill="#0B6E69"/><text x="632" y="1792" text-anchor="end" fill="#152536" font-family="Lato, Noto Sans, sans-serif" font-size="36" font-weight="600">LightGBM</text><text x="1564" y="1792" text-anchor="start" fill="#152536" font-family="Lato, Noto Sans, sans-serif" font-size="36" font-weight="700">Kairos-64</text><text x="1564" y="1829" text-anchor="start" fill="#B8493C" font-family="Lato, Noto Sans, sans-serif" font-size="29" font-weight="600">identity changes</text><text x="1564" y="1864" text-anchor="start" fill="#B8493C" font-family="Lato, Noto Sans, sans-serif" font-size="29" font-weight="600">Sharpe -0.207</text><line x1="0" y1="2186" x2="2400" y2="2186" stroke="#CDD9DF" stroke-width="2"/><text x="0" y="2072" text-anchor="start" fill="#152536" font-family="Lato, Noto Sans, sans-serif" font-size="38" font-weight="700">Volume h5</text><path d="M 680 2060 C 1070 2060, 1480 2060, 1510 2060" fill="none" stroke="#B8493C" stroke-width="16" stroke-linecap="round"/><circle cx="680" cy="2060" r="28" fill="#5E6B76"/><circle cx="1510" cy="2060" r="28" fill="#0B6E69"/><text x="632" y="2072" text-anchor="end" fill="#152536" font-family="Lato, Noto Sans, sans-serif" font-size="36" font-weight="600">LightGBM</text><text x="1564" y="2072" text-anchor="start" fill="#152536" font-family="Lato, Noto Sans, sans-serif" font-size="36" font-weight="700">Kairos-64</text><text x="1564" y="2109" text-anchor="start" fill="#B8493C" font-family="Lato, Noto Sans, sans-serif" font-size="29" font-weight="600">identity changes</text><text x="1564" y="2144" text-anchor="start" fill="#B8493C" font-family="Lato, Noto Sans, sans-serif" font-size="29" font-weight="600">Sharpe 0.069</text><line x1="0" y1="2466" x2="2400" y2="2466" stroke="#CDD9DF" stroke-width="2"/><text x="0" y="2352" text-anchor="start" fill="#152536" font-family="Lato, Noto Sans, sans-serif" font-size="38" font-weight="700">Volume h20</text><path d="M 680 2340 C 1070 2340, 1480 2340, 1510 2340" fill="none" stroke="#5E6B76" stroke-width="16" stroke-linecap="round"/><circle cx="680" cy="2340" r="28" fill="#5E6B76"/><circle cx="1510" cy="2340" r="28" fill="#5E6B76"/><text x="632" y="2352" text-anchor="end" fill="#152536" font-family="Lato, Noto Sans, sans-serif" font-size="36" font-weight="600">LightGBM</text><text x="1564" y="2352" text-anchor="start" fill="#152536" font-family="Lato, Noto Sans, sans-serif" font-size="36" font-weight="700">LightGBM</text><text x="1564" y="2389" text-anchor="start" fill="#5E6B76" font-family="Lato, Noto Sans, sans-serif" font-size="29" font-weight="600">same leader</text><text x="1564" y="2424" text-anchor="start" fill="#5E6B76" font-family="Lato, Noto Sans, sans-serif" font-size="29" font-weight="600">Sharpe -0.072</text><line x1="0" y1="2746" x2="2400" y2="2746" stroke="#CDD9DF" stroke-width="2"/><text x="0" y="2632" text-anchor="start" fill="#152536" font-family="Lato, Noto Sans, sans-serif" font-size="38" font-weight="700">Volume h50</text><path d="M 680 2620 C 1070 2620, 1480 2620, 1510 2620" fill="none" stroke="#B8493C" stroke-width="16" stroke-linecap="round"/><circle cx="680" cy="2620" r="28" fill="#5E6B76"/><circle cx="1510" cy="2620" r="28" fill="#0B6E69"/><text x="632" y="2632" text-anchor="end" fill="#152536" font-family="Lato, Noto Sans, sans-serif" font-size="36" font-weight="600">LightGBM</text><text x="1564" y="2632" text-anchor="start" fill="#152536" font-family="Lato, Noto Sans, sans-serif" font-size="36" font-weight="700">Kairos-64</text><text x="1564" y="2669" text-anchor="start" fill="#B8493C" font-family="Lato, Noto Sans, sans-serif" font-size="29" font-weight="600">identity changes</text><text x="1564" y="2704" text-anchor="start" fill="#B8493C" font-family="Lato, Noto Sans, sans-serif" font-size="29" font-weight="600">Sharpe 0.056</text><line x1="0" y1="2904" x2="2400" y2="2904" stroke="#152536" stroke-width="4"/><text x="0" y="2990" text-anchor="start" fill="#0B6E69" font-family="Lato, Noto Sans, sans-serif" font-size="35" font-weight="700">Interpretation</text><text x="0" y="3048" text-anchor="start" fill="#152536" font-family="Lato, Noto Sans, sans-serif" font-size="40" font-weight="600">Prediction ranking alone does not determine post-cost selection. Positive post-cost point estimates remain statistically inconclusive.</text></svg>
