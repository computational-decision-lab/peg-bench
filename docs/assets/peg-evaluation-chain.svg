<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 3200" role="img" aria-label="PEG-Bench evaluation chain and six-panel clean-active ranking reversal"><rect width="2400" height="3200" fill="#F8F7F2"/><text x="0" y="68" text-anchor="start" fill="#0B6E69" font-family="Lato, Noto Sans, sans-serif" font-size="38" font-weight="700">ONE EVALUATION CHAIN, TWO DIFFERENT LEADERBOARDS</text><text x="0" y="145" text-anchor="start" fill="#152536" font-family="Lato, Noto Sans, sans-serif" font-size="48" font-weight="600">A forecast ranking becomes a decision only after its action path meets the same cost and risk accounting.</text><line x1="0" y1="210" x2="2400" y2="210" stroke="#152536" stroke-width="4"/><circle cx="34" cy="300" r="28" fill="#5E6B76"/><text x="34" y="311" text-anchor="middle" fill="#FFFFFF" font-family="Lato, Noto Sans, sans-serif" font-size="34" font-weight="700">1</text><text x="0" y="395" text-anchor="start" fill="#152536" font-family="Lato, Noto Sans, sans-serif" font-size="41" font-weight="700">Rank predictors</text><text x="0" y="440" text-anchor="start" fill="#5E6B76" font-family="Lato, Noto Sans, sans-serif" font-size="30" font-weight="600">R0: RankIC / direction</text><line x1="490" y1="345" x2="562" y2="345" stroke="#152536" stroke-width="5"/><path d="M 562 345 l -24 -15 l 0 30 z" fill="#152536"/><circle cx="624" cy="300" r="28" fill="#0B6E69"/><text x="624" y="311" text-anchor="middle" fill="#FFFFFF" font-family="Lato, Noto Sans, sans-serif" font-size="34" font-weight="700">2</text><text x="590" y="395" text-anchor="start" fill="#152536" font-family="Lato, Noto Sans, sans-serif" font-size="41" font-weight="700">Map forecast to action</text><text x="590" y="440" text-anchor="start" fill="#0B6E69" font-family="Lato, Noto Sans, sans-serif" font-size="30" font-weight="600">shared interface</text><line x1="1125" y1="345" x2="1197" y2="345" stroke="#152536" stroke-width="5"/><path d="M 1197 345 l -24 -15 l 0 30 z" fill="#152536"/><circle cx="1259" 